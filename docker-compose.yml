services:
  app:
    container_name : discord-status-spoofer
    build: ./
    restart: unless-stopped
    # Token (and PORT) are injected at runtime from the .env that lives
    # next to this compose file — never baked into the image (see
    # .dockerignore).
    env_file:
      - .env
    ports:
      - '${PORT:-8081}:${PORT:-8081}'
    deploy:
      resources:
        limits:
          memory: 256M # bandaid solution to help with memory, no clue if the app still works... testing for now
